name: Validate and build

on:
  push:
    branches: [main, arena/a696d72a-turbowebdownloader]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit, browser and UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest
      - run: python -m playwright install --with-deps chromium
      - name: Run all tests with real Chromium
        shell: bash
        run: |
          export TURBOWEB_TEST_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python -m pytest -q
      - run: node --check turboweb/static/app.js
      - run: python -m compileall -q turboweb desktop.py run.py

  windows:
    name: Build Windows desktop distribution
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-desktop.txt
      - name: Install bundled Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$pwd\build\browsers"
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python scripts/make_icon.py
      - name: Package native application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name TurboWebDownloader --icon turboweb/static/app.ico --collect-all playwright --add-data "turboweb/templates;turboweb/templates" --add-data "turboweb/static;turboweb/static" --add-data "build/browsers;browsers" desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README.md,LICENSE -Destination dist/TurboWebDownloader
      - uses: actions/upload-artifact@v4
        with:
          name: TurboWebDownloader-Windows-x64
          path: dist/TurboWebDownloader/
          if-no-files-found: error
          retention-days: 14
